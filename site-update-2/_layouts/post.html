---
layout: default
---
<article class="essay">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="essay-body">
{{ content }}
  </div>
  {%- if page.collection == "notes" %}
  <p class="back"><a href="/notes/">← All notes</a></p>
  {%- else %}
  <p class="back"><a href="/writing/">← All writing</a></p>
  {%- endif %}
</article>
