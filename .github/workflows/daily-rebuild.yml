# Rebuilds the site every morning so posts dated in the future go live on
# their date without needing another commit. Can also be run by hand from
# the Actions tab ("Run workflow").
name: Daily rebuild

on:
  schedule:
    # 10:17 UTC = 6:17 am Eastern (5:17 am in winter)
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
