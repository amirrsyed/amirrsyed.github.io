# Builds the site and checks for broken internal links and images on every
# pull request (and on pushes to main), so a broken change is caught before,
# or right after, it goes live. A red X on a pull request means: don't merge yet.
name: Build and link check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with the same Jekyll version GitHub Pages uses
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check internal links and images
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-missing-href \
            --no-enforce-https \
            --ignore-urls "/^https:\/\/amirsyed\.xyz/"
